name: Build APK and AAB

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Permanent signing key (if configured)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PT2VHF_SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build site APK (github) and Google Play AAB (play)
        run: ./gradlew --no-daemon assembleGithubRelease bundlePlayRelease
      - name: Name the outputs
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          S=$([ -n "$PT2VHF_SIGNING_STORE_FILE" ] && echo "" || echo "-DEBUG-KEY")
          mkdir -p out
          cp app/build/outputs/apk/github/release/app-github-release.apk "out/PT2VHF-Sonde-Finder-v$V$S.apk"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "out/PT2VHF-Sonde-Finder-v$V$S-play.aab"
          sha256sum out/*
      - uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-Sonde-Finder
          path: out/*
