name: Screenshots
# On demand: runs the app on an Android emulator in the cloud, at a place with many radiosonde flights
# (Brasília, SBBR launches twice a day), and saves screenshots of the main screens for the website.
on:
  workflow_dispatch:
    inputs:
      lat: { description: 'Latitude', default: '-15.7801' }
      lon: { description: 'Longitude', default: '-47.9292' }
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Debug APK with the x86_64 libraries
        run: ./gradlew --no-daemon assembleGithubDebug -Pemulator
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Screenshots on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          LAT: ${{ inputs.lat }}
          LON: ${{ inputs.lon }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/screenshots.sh
      - name: Website images (540 px wide JPEG)
        run: |
          sudo apt-get -qq install -y imagemagick > /dev/null
          mkdir -p shots/web
          for f in shots/*.png; do convert "$f" -resize 540x -quality 82 "shots/web/$(basename "${f%.png}").jpg"; done
          ls -l shots shots/web
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
